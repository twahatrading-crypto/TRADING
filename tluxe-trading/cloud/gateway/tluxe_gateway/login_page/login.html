<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Sign in · Trading by TLUXE</title>
<link rel="icon" href="/login/assets/mark.svg" type="image/svg+xml">
<link rel="stylesheet" href="/login/assets/login.css">
<script src="/login/assets/login.js" defer></script>
</head>
<body>
<main class="lg">
  <div class="lg__glow" aria-hidden="true"></div>
  <form class="lg__card" id="lg-form" novalidate aria-labelledby="lg-title">
    <div class="lg__brand">
      <img src="/login/assets/mark.svg" alt="" width="44" height="44">
      <div>
        <div class="lg__name">TLUXE <span>|</span> TRADING</div>
        <div class="lg__by">Trading by TLUXE</div>
      </div>
    </div>
    <h1 id="lg-title" class="lg__title">Secure sign in</h1>
    <p class="lg__sub">Private trading workspace — authorized administrator only.</p>

    <label class="lg__label" for="lg-email">Email</label>
    <input class="lg__input" id="lg-email" name="email" type="email" autocomplete="username" inputmode="email" autocapitalize="off" spellcheck="false" maxlength="254" required>

    <label class="lg__label" for="lg-password">Password</label>
    <div class="lg__pw">
      <input class="lg__input" id="lg-password" name="password" type="password" autocomplete="current-password" maxlength="256" required>
      <button type="button" class="lg__eye" id="lg-eye" aria-label="Show password" aria-pressed="false" aria-controls="lg-password">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.8" d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.8"/><path class="lg__slash" stroke="currentColor" stroke-width="1.8" d="M3 3l18 18"/></svg>
      </button>
    </div>
    <p class="lg__caps" id="lg-caps" hidden>Caps Lock is on.</p>

    <p class="lg__error" id="lg-error" role="alert" hidden></p>

    <button class="lg__btn" id="lg-submit" type="submit">
      <span class="lg__spin" aria-hidden="true"></span><span class="lg__btn-text">Secure Sign In</span>
    </button>
    <p class="lg__foot">
      <svg viewBox="0 0 24 24" width="13" height="13" aria-hidden="true"><path fill="currentColor" d="M12 2a5 5 0 0 0-5 5v3H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8a2 2 0 0 0-2-2h-1V7a5 5 0 0 0-5-5Zm-3 8V7a3 3 0 1 1 6 0v3H9Z"/></svg>
      Encrypted connection · session protected · read-only analysis
    </p>
  </form>
  <noscript><p class="lg__noscript">JavaScript is required to sign in.</p></noscript>
</main>
</body>
</html>
