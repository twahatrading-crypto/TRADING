  mapprod2:
    # GC Liquidity Map viewport + 250 ms Strong persistence on the PRODUCTION domain (READ ONLY): LIVE SESSION default,
    # recorded share of the window, short gaps hatched, the old outage gap in 24H, CURRENT DEPTH == /api/ibkr/book,
    # Strong Liquidity Now unchanged by window switches, ages advancing with real 250 ms observations. Nothing written.
    if: ${{ contains(github.event.head_commit.message, '[mapprod2]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: GC Liquidity Map viewport + Strong persistence production verification (read only)
        shell: bash
        run: |
          npm init -y >/dev/null && npm i -s playwright@1 >/dev/null && npx playwright install --with-deps chromium >/dev/null 2>&1
          cat > mp2.cjs <<'JS'
          const zlib = require('zlib');
          const { chromium } = require('playwright');
          const base = 'https://twahatrading.com';
          const UA = { 'User-Agent': 'tluxe-cloud-probe/1.0' };
          const j = async (p) => (await fetch(base + p, { headers: UA })).json();
          const iso = (t) => (t ? new Date(Number(t)).toISOString() : '-');
          const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
          const out = (name, buf) => {
            const b = zlib.gzipSync(buf).toString('base64');
            const n = Math.ceil(b.length / 60000);
            for (let i = 0; i < n; i++) console.log(`CAPT ${name} ${i + 1}/${n} ${b.slice(i * 60000, (i + 1) * 60000)}`);
          };
          let fails = 0;
          const check = (ok, m) => { console.log(`    ${ok ? 'OK  ' : 'FAIL'} ${m}`); if (!ok) fails++; };
          const OUT = Date.UTC(2026, 8, 30, 6, 45, 0, 844), BACK = Date.UTC(2026, 9, 1, 7, 48, 3, 341);
          (async () => {
            const cfg = await j('/api/config');
            if (cfg.authRequired) { console.log('OWNER AUTH ACTIVE - credential-free check not possible.'); process.exit(0); }
            let deployed = false, asset = '';
            for (let i = 0; i < 60 && !deployed; i++) {
              const html = await (await fetch(base + '/', { headers: UA })).text();
              const m = html.match(/\/assets\/index-[^"']+\.js/);
              asset = m ? m[0] : '';
              if (asset) { const js = await (await fetch(base + asset, { headers: UA })).text(); deployed = asset !== '/assets/index-Cc0vhVaD.js' && js.includes('250 ms RECORDED DEPTH NOT CURRENT') && js.includes('LIVE SESSION') && js.includes('LOADING RECORDED DEPTH'); }
              console.log(`deploy ${i}: bundle=${asset} new=${deployed}`);
              if (!deployed) await sleep(20000);
            }
            check(deployed, `production bundle ${asset} carries the viewport + 250 ms Strong persistence build`);
            if (!deployed) process.exit(1);
            let live = null;
            for (let i = 0; i < 40; i++) {
              const bk = await j('/api/ibkr/book?root=GC');
              console.log(`ibkr ${i}: ${iso(Date.now())} state=${bk.state} contract=${bk.contract?.localSymbol} lastUpdate=${iso(bk.lastUpdateMs)} rows=${bk.rows?.bids?.length}x${bk.rows?.asks?.length}`);
              if (bk.state === 'LIVE' && Date.now() - bk.lastUpdateMs < 5000) { live = bk; break; }
              await sleep(15000);
            }
            check(!!live, 'IBKR GC depth LIVE on production');
            // the outage gap is still in the recording (nothing filled): no recorded column between the two
            const hm = await j(`/api/ibkr/heatmap?root=GC&from=${OUT - 3600000}&to=${BACK + 3600000}&bucket=300000`);
            // recorded-valid segments of every bucket (a bucket may hold depth only before / after the outage)
            const segs = (hm.columns || []).flatMap((c) => (c[4] && c[4].length ? c[4] : [[c[0], c[0] + 300000]]));
            const inGap = segs.filter(([a, z]) => z > OUT + 1 && a < BACK - 1);
            const lastBefore = Math.max(...segs.filter(([, z]) => z <= OUT + 1).map(([, z]) => z));
            const firstAfter = Math.min(...segs.filter(([a]) => a >= BACK - 1).map(([a]) => a));
            check(inGap.length === 0, `recorded history: no recorded-valid depth between ${iso(OUT)} and ${iso(BACK)} (last before ${iso(lastBefore)}, first after ${iso(firstAfter)}, ${inGap.length} segments inside) - the 25 h outage gap is intact`);
            const b = await chromium.launch();
            const ctx = await b.newContext({ viewport: { width: 1680, height: 960 } });
            await ctx.addInitScript(() => { try { localStorage.setItem('tluxe.instrument.v1', 'GC'); } catch {} });
            const p = await ctx.newPage();
            const errs = [];
            p.on('pageerror', (e) => errs.push(String(e).slice(0, 200)));
            p.on('request', (r) => { if (/localhost|127\.0\.0\.1|:876\d|:4001/.test(r.url())) errs.push('LOCAL ' + r.url()); });
            await p.goto(base + '/#/engines/gc-liquidity-map');
            await p.waitForSelector('canvas.gcmap__canvas', { timeout: 120000 });
            for (let i = 0; i < 30; i++) { const ok = await p.evaluate(() => { const c = document.querySelector('canvas.gcmap__canvas'); const n = document.querySelector('[data-testid="gcmap-now"]'); return c && Number(c.dataset.heatCols) > 0 && c.dataset.loading === '0' && c.dataset.depth !== 'none' && n && n.dataset.fineLast; }); if (ok) break; await p.waitForTimeout(1000); }
            await p.waitForTimeout(4000);
            const ds = () => p.evaluate(() => { const c = document.querySelector('canvas.gcmap__canvas'); const n = document.querySelector('[data-testid="gcmap-now"]'); return { ...c.dataset, rows: n.dataset.rows, levels: n.dataset.fineLevels, fineSince: n.dataset.fineSince, fineLast: n.dataset.fineLast, now: Date.now(), panel: n.innerText.replace(/\n+/g, ' | '), sel: document.querySelector('[data-testid="gcmap-range"] [aria-selected="true"]')?.textContent, caption: document.querySelector('[data-testid="gcmap-window"]')?.textContent }; });
            const d0 = await ds();
            console.log(`DEFAULT: selected="${d0.sel}" range=${d0.range} vp=${iso(d0.vpT0)}..${iso(d0.vpT1)} bucket=${d0.bucketMs} recordedShare=${d0.recordedShare} plotShare=${d0.plotShare} profileShare=${d0.profileShare} gaps=${d0.gaps}`);
            console.log(`CAPTION: ${d0.caption}`);
            check(d0.sel === 'LIVE SESSION' && /^session:/.test(d0.range), 'LIVE SESSION is the default window');
            check(Number(d0.recordedShare) >= 0.9, `actual recorded depth fills the LIVE SESSION window (${(Number(d0.recordedShare) * 100).toFixed(1)} % recorded, plot ${(Number(d0.plotShare) * 100).toFixed(0)} % of the canvas)`);
            const gaps = JSON.parse(d0.gaps || '[]');
            console.log(`  short real gaps inside the session (hatched, never painted): ${gaps.map((g) => `${iso(g[0])}..${iso(g[1])} (${((g[1] - g[0]) / 1000).toFixed(1)} s)`).join(', ') || 'none'}`);
            out('MP2-live', await p.screenshot());
            // CURRENT DEPTH == /api/ibkr/book
            let same = 0, exact = 0;
            for (let i = 0; i < 20 && same < 6; i++) {
              const r = await p.evaluate(async () => { const bk = await (await fetch('/api/ibkr/book?root=GC', { credentials: 'same-origin' })).json(); const c = document.querySelector('canvas.gcmap__canvas'); return { u: bk.lastUpdateMs, bids: (bk.rows?.bids ?? []).map((x) => [x.price, x.size]), asks: (bk.rows?.asks ?? []).map((x) => [x.price, x.size]), d: c.dataset.depth !== 'none' ? JSON.parse(c.dataset.depth) : null }; });
              if (r.d && r.d.updateMs === r.u) { same++; if (JSON.stringify(r.d.bids) === JSON.stringify(r.bids) && JSON.stringify(r.d.asks) === JSON.stringify(r.asks)) exact++; else console.log(`  MISMATCH api=${JSON.stringify(r.bids.slice(0, 3))} drawn=${JSON.stringify(r.d.bids.slice(0, 3))}`); }
              await p.waitForTimeout(1200);
            }
            check(same > 0 && exact === same, `CURRENT DEPTH drawn == /api/ibkr/book on every same-update sample (${exact}/${same})`);
            // Strong Liquidity Now across window switches (same real observations): runs identified by side/price/runStart/qualifiedAt
            const seq = ['1H', '3H', '6H', '12H', '24H', 'LIVE SESSION', '6H', '1H', 'LIVE SESSION'];
            const snaps = [{ w: 'LIVE SESSION', ...d0 }];
            for (const w of seq) {
              await p.getByRole('tablist', { name: 'History window' }).getByRole('tab', { name: w, exact: true }).click();
              const tc = Date.now();
              await p.waitForTimeout(2500); // the new window's bucket is requested and marked LOADING first
              let d = await ds();
              while (!(Number(d.heatCols) > 0 && d.loading === '0') && Date.now() - tc < 30000) { await p.waitForTimeout(250); d = await ds(); }
              check(Number(d.heatCols) > 0 && d.loading === '0', `${w}: the window's recorded depth loaded (bucket ${d.bucketMs})`);
              console.log(`  ${w}: chart loaded in ${((Date.now() - tc) / 1000).toFixed(1)} s (bucket ${d.bucketMs}, ${d.heatCols} columns, loading=${d.loading})`);
              snaps.push({ w, ...d });
              if (w === '6H' || w === '24H') out(`MP2-${w}`, await p.screenshot());
              if (w === '24H') { console.log(`24H: vp=${iso(d.vpT0)}..${iso(d.vpT1)} bucket=${d.bucketMs} heat=${iso(d.heatFirstMs)}..${iso(d.heatLastMs)} recordedShare=${d.recordedShare} gaps=${d.gaps}`); check(Number(d.heatCols) > 0 && Number(d.vpT0) < BACK && Number(d.heatFirstMs) >= BACK - 300000 && Number(d.recordedShare) < 0.5, `24H: heat only from the reconnect on - window ${iso(d.vpT0)}.. is hatched DEPTH GAP up to ${iso(BACK)} (${(Number(d.recordedShare) * 100).toFixed(0)} % of the window recorded)`); }
            }
            let consistent = true;
            for (let i = 0; i < snaps.length; i++) {
              const s = snaps[i];
              const rows = JSON.parse(s.rows || '[]');
              console.log(`STRONG ${s.w.padEnd(12)} chartBucket=${String(s.bucketMs).padStart(6)} fine250=${iso(s.fineSince)}..${iso(s.fineLast)} rows=${JSON.stringify(rows)}`);
              if (i === 0) continue;
              const prev = JSON.parse(snaps[i - 1].rows || '[]');
              const dt = Number(s.fineLast) - Number(snaps[i - 1].fineLast);
              for (const q of prev) {
                if (rows.some((r) => r.side === q.side && r.price === q.price && r.runStart === q.runStart)) continue;
                const lv = JSON.parse(s.levels || '[]').find((x) => x.side === q.side && x.price === q.price);
                console.log(`  LEFT ${q.side} ${q.price} (run ${iso(q.runStart)}): at this read the 250 ms level is ${lv ? `size ${lv.size}, run ${iso(lv.runStart)} age ${(lv.ageMs / 1000).toFixed(2)} s${lv.runStart !== q.runStart ? ' - the run ENDED and restarted in the 250 ms data' : ' - same run (size / relative / distance now below the threshold in the live book)'}` : 'NOT in the latest 250 ms bucket - the run ended in the 250 ms data'}`);
              }
              for (const r of rows) {
                const q = prev.find((x) => x.side === r.side && x.price === r.price && x.runStart === r.runStart);
                if (!q) continue;
                const dAge = r.ageMs - q.ageMs;
                if (q.qualifiedAt !== r.qualifiedAt || Math.abs(dAge - dt) > 1) { consistent = false; console.log(`  CHANGED ${s.w}: ${JSON.stringify(q)} -> ${JSON.stringify(r)} (250 ms series advanced ${dt} ms)`); }
