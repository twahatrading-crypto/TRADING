          node hm.cjs
  ibkr:
    # IBKR COMEX price-level depth on production (server-side pull from the VPS depth service). Read-only; no secret used.
    if: ${{ contains(github.event.head_commit.message, '[ibkr]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: VPS depth service - public health only (the depth routes must refuse a request without the server credential)
        shell: bash
        run: |
          echo "GET /health -> $(curl -s -m 15 -o h.json -w '%{http_code}' https://depth.twahatrading.com/health) :: $(head -c 300 h.json)"
          for r in GC SI; do echo "GET /depth/$r (no credential) -> HTTP $(curl -s -m 15 -o /dev/null -w '%{http_code}' https://depth.twahatrading.com/depth/$r)"; done
      - name: TLUXE production - IBKR depth API + Liquidity Heatmap GC -> SI -> GC (browser)
        shell: bash
        run: |
          npm init -y >/dev/null && npm i -s playwright@1 >/dev/null && npx playwright install --with-deps chromium >/dev/null 2>&1
          cat > ibkr.cjs <<'JS'
          const { chromium } = require('playwright');
          const base = 'https://twahatrading.com';
          let fails = 0;
          const check = (ok, m) => { console.log(`    ${ok ? 'OK  ' : 'FAIL'} ${m}`); if (!ok) fails++; };
          const j = async (p) => (await fetch(base + p)).json();
          // Ports only as host:port (market-data numbers such as "low":4001.2 are not addresses); returns the matched text.
          const LEAK = /bearer|authorization|depth\.twahatrading|TLUXE_IBKR_DEPTH|(?:localhost|127\.0\.0\.1|[a-z0-9-]+\.[a-z0-9.-]+):(?:8766|4001)\b/i;
          const leakOf = (s) => { const m = LEAK.exec(s); return m ? s.slice(Math.max(0, m.index - 40), m.index + m[0].length + 40) : null; };
          const leak = (s) => leakOf(s) !== null;
          (async () => {
            await new Promise((r) => setTimeout(r, 240000)); // this push redeploys Railway
            let st = null;
            for (let i = 0; i < 40; i++) {
              const cfg = await j('/api/config');
              st = await j('/api/ibkr/status');
              const db = await Promise.all(['GC', 'SI'].map((x) => j(`/api/databento/status?root=${x}`)));
              console.log(`settle ${i}: ibkrDepth=${cfg.ibkrDepth} mode=${st.mode} GC=${st.roots.GC.state} SI=${st.roots.SI.state} | databento ${db.map((x) => `${x.activeContract} ${x.freshness}`).join(' ')}`);
              if (cfg.ibkrDepth && st.roots.GC.state === 'LIVE' && st.roots.SI.state === 'LIVE' && db.every((x) => x.verifiedByRealData)) break;
              await new Promise((r) => setTimeout(r, 15000));
            }
            const cfgRaw = await (await fetch(base + '/api/config')).text();
            console.log(`/api/config ${cfgRaw}`);
            check(JSON.parse(cfgRaw).ibkrDepth === true, 'IBKR depth configured on the gateway (flag only)');
            check(st.mode === 'pull' && st.depthTypeCode === 'PRICE_LEVEL' && st.mbo === false, `status mode=${st.mode} depthType=${st.depthTypeCode} mbo=${st.mbo}`);
            for (const root of ['GC', 'SI']) {
              const raw = { status: await (await fetch(base + '/api/ibkr/status')).text(), book: await (await fetch(base + `/api/ibkr/book?root=${root}`)).text() };
              const b = JSON.parse(raw.book);
              const u = await (await fetch(base + `/api/ibkr/updates?root=${root}&epoch=${b.epoch}&after=${b.depthSeq}`)).text();
              const db = await j(`/api/databento/status?root=${root}`);
              const r = st.roots[root];
              console.log(`\n== ${root} state=${b.state} valid=${b.valid} source=${b.source} depthType=${b.depthType} mbo=${b.mbo} contract=${JSON.stringify(b.contract)} lastUpdate=${b.lastUpdateMs && new Date(b.lastUpdateMs).toISOString()} age=${b.lastUpdateMs && (Date.now() - b.lastUpdateMs)}ms polls=${r.polls} outOfOrder=${r.outOfOrder} malformed=${r.malformed}`);
              console.log(`   bids ${JSON.stringify(b.rows.bids.slice(0, 4))}`);
              console.log(`   asks ${JSON.stringify(b.rows.asks.slice(0, 4))}`);
              check(b.state === 'LIVE' && b.valid, `${root}: LIVE`);
              check(b.bids.length > 0 && b.asks.length > 0 && b.rows.bids.length > 0 && b.rows.asks.length > 0, `${root}: real bids (${b.bids.length}) + asks (${b.asks.length})`);
              check(b.bids.length === 0 || b.asks.length === 0 || b.bids[0][0] < b.asks[0][0], `${root}: best bid ${b.bids[0] && b.bids[0][0]} < best ask ${b.asks[0] && b.asks[0][0]}`);
              check(b.depthType === 'PRICE_LEVEL' && b.mbo === false && b.source === 'Interactive Brokers', `${root}: PRICE_LEVEL, mbo false, Interactive Brokers`);
              check(b.contract && b.contract.localSymbol === db.activeContract && b.contract.exchange === 'COMEX', `${root}: IBKR ${b.contract && b.contract.localSymbol} = Databento ${db.activeContract} (COMEX)`);
              check(b.rows.bids.every((x, i, a) => i === 0 || x.position > a[i - 1].position), `${root}: rows ordered by position`);
              check(!leak(raw.status + raw.book + u + cfgRaw), `${root}: no credential / VPS address in any /api response`);
            }
            for (const bad of ['XAUUSD', 'XAGUSD']) check((await fetch(base + `/api/ibkr/book?root=${bad}`)).status === 400, `${bad} is never routed through IBKR`);
            const b = await chromium.launch();
            for (const inst of ['GC', 'SI', 'GC']) {
              const db = await j(`/api/databento/status?root=${inst}`);
              console.log(`\n######## ${inst} contract=${db.activeContract}`);
              const ctx = await b.newContext({ viewport: { width: 1920, height: 1080 } });
              await ctx.addInitScript((i) => { try { localStorage.setItem('tluxe.instrument.v1', i); } catch {} }, inst);
              const p = await ctx.newPage();
              const errs = [], hosts = new Set(), ibkrCalls = [], authValues = new Set();
              p.on('pageerror', (e) => errs.push(String(e).slice(0, 200)));
              p.on('request', (r) => {
                const h = r.headers();
                hosts.add(new URL(r.url()).host);
                if (/\/api\/ibkr\//.test(r.url())) ibkrCalls.push(r.url().replace(base, ''));
                if (/localhost|127\.0\.0\.1|:876\d|:4001|depth\.twahatrading/.test(r.url())) errs.push('FORBIDDEN HOST ' + r.url());
                // The existing Databento / MT5 / news clients send the fixed, documented, non-secret placeholder
                // "Bearer cloud-session" (src/config/deployment.ts CLOUD_SESSION_TOKEN; the gateway ignores it). Any
                // other Authorization value, or any Authorization header at all on /api/ibkr/*, is a failure.
                if (h.authorization) authValues.add(`${new URL(r.url()).pathname.split('/').slice(0, 3).join('/')} -> ${h.authorization === 'Bearer cloud-session' ? 'fixed cloud-session placeholder' : 'OTHER VALUE'}`);
                if (h.authorization && (h.authorization !== 'Bearer cloud-session' || /\/api\/ibkr\//.test(r.url()))) errs.push('AUTH HEADER on ' + r.url());
                if (Object.entries(h).some(([k, v]) => k !== 'authorization' && /bearer/i.test(v))) errs.push('BEARER in another header on ' + r.url());
              });
