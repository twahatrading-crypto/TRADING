              console.log(`${r} timestamp semantics: Databento trade = tsEventNs (CME matching-engine event time, UTC ns since epoch); IBKR depth = lastUpdate (VPS bridge receive time of the IBKR update, UTC ms since epoch). Both absolute UTC - no timezone conversion anywhere; expected skew = IBKR network + bridge latency (tens of ms).`);
