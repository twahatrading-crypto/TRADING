# Read-only probe of the deployed TRADING service from GitHub's runners (no secrets used or printed).
# Reports which web bundle is served (cloud vs local build) and what the public Databento endpoints return.
name: cloud-probe
on:
  push:
    branches: ["claude/**"]
    paths: [".github/workflows/cloud-probe.yml", ".github/cloud-probe.trigger"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # set MAX_PROBES via the trigger file content if needed
    env:
      BASE: https://trading-production-e1d5.up.railway.app
      MAX_PROBES: 1
    steps:
      - name: Probe splendid-exploration (once)
        shell: bash
        run: |
          S=https://splendid-exploration-production-535b.up.railway.app
          for p in / /healthz /api/ai/health /api/config; do
            echo "splendid GET $p -> $(curl -s -m 10 -o body -w '%{http_code} %{content_type}' "$S$p") :: $(head -c 160 body | tr '\n' ' ')"
          done
      - name: Probe TRADING (up to 20 min, every 60 s)
        shell: bash
        run: |
          for i in $(seq 1 "${MAX_PROBES:-20}"); do
            echo "=== probe $i $(date -u +%FT%TZ)"
            code=$(curl -s -o index.html -w '%{http_code}' "$BASE/")
            js=$(grep -o 'assets/index-[^"]*\.js' index.html | head -1)
            echo "GET / -> $code  bundle=$js"
            if [ -n "$js" ]; then
              curl -s "$BASE/$js" -o app.js
              echo "bundle kind: cloud=$(grep -c 'through the TLUXE gateway' app.js) local=$(grep -c 'port 8766' app.js)"
            fi
            echo "GET /healthz -> $(curl -s -m 10 "$BASE/healthz" | head -c 200)"
            echo "GET /api/config -> $(curl -s -m 10 "$BASE/api/config" | head -c 300)"
            curl -s -m 15 "$BASE/api/databento/status?root=GC" -o st.json -w "status http %{http_code}\n"
            python3 - <<'PY' || head -c 400 st.json
          import json
          d = json.load(open("st.json"))
          keys = ["state","connection","dataset","plan","subscribed","activeContract","instrumentId","instrumentStatus","lastEventUtc",
                  "lastEventAgeMs","freshness","marketOpen","received","verifiedByRealData","lastTrade","lastBar","source","detail","depth"]
          print(json.dumps({k: d.get(k) for k in keys}, indent=1))
          PY
            if grep -q '"verifiedByRealData": *true' st.json; then
              echo "GET feed -> $(curl -s -m 15 "$BASE/api/databento/v1/feed?cursor=0&roots=GC" | head -c 600)"
              echo "VERIFIED"; break
            fi
            sleep 60
          done
  gcsi:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BASE: https://trading-production-e1d5.up.railway.app
    steps:
      - name: GC + SI real data and history per timeframe (waits up to 20 min for history to settle)
        shell: bash
        run: |
          cat > check.py <<'PY'
          import json, sys, time, urllib.request
          B = "https://trading-production-e1d5.up.railway.app"
          def get(p):
              with urllib.request.urlopen(B + p, timeout=20) as r:
                  return json.load(r)
          final = ("READY", "NOT_ENTITLED", "COST_BLOCKED", "AUTH_ERROR", "UNAVAILABLE", "DISABLED")
          for attempt in range(40):
              out, done = {}, True
              for root in ("GC", "SI"):
                  s = get(f"/api/databento/status?root={root}")
                  h = s.get("history") or {}
                  done &= s.get("verifiedByRealData") is True and h.get("state") in final
                  out[root] = {k: s.get(k) for k in ("state", "connection", "dataset", "subscribed", "activeContract", "instrumentId", "lastEventUtc",
                                                   "lastEventAgeMs", "freshness", "received", "verifiedByRealData", "lastTrade", "lastBar", "depth")}
                  out[root]["history"] = {k: h.get(k) for k in ("state", "contract", "bars", "estimatedCostUsd", "range", "message")}
              if done or attempt == 39:
                  break
              print(time.strftime("%H:%M:%S"), {r: (o["verifiedByRealData"], o["history"]["state"]) for r, o in out.items()}, flush=True)
              time.sleep(30)
          print(json.dumps(out, indent=1))
          for root in ("GC", "SI"):
              for tf in ("M1", "M5", "M15", "M30", "H1", "H4", "D1"):
                  c = get(f"/api/databento/v1/candles/{root}?timeframe={tf}&limit=5000")
                  bars = c.get("bars") or []
                  closed = [b for b in bars if b.get("isClosed")]
                  iso = lambda t: time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime(t)) if t else None
                  print(f"{root} {tf:>3}: bars={len(bars):5d} closed={len(closed):5d} contract={c.get('contract')} history={c.get('history')} "
                        f"first={iso(bars[0]['time']) if bars else None} lastClosed={iso(closed[-1]['time']) if closed else None} "
                        f"last={json.dumps({k: bars[-1][k] for k in ('open','high','low','close','volume','isClosed')}) if bars else None}")
          PY
          python3 check.py
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Load the live TRADING app in Chromium and read what it shows
        shell: bash
        run: |
          npm init -y >/dev/null && npm i -s playwright@1 >/dev/null && npx playwright install --with-deps chromium >/dev/null 2>&1
          cat > probe.cjs <<'JS'
          const { chromium } = require('playwright');
          (async () => {
            const base = 'https://trading-production-e1d5.up.railway.app';
            const b = await chromium.launch(); const p = await b.newPage({ viewport: { width: 1400, height: 900 } });
            const api = new Set(); const errs = [];
            p.on('request', (r) => { const u = new URL(r.url()); if (u.pathname.startsWith('/api/')) api.add(u.pathname); if (/:876\d/.test(r.url())) errs.push('LOCALHOST ' + r.url()); });
            p.on('pageerror', (e) => errs.push(String(e)));
            await p.goto(base + '/'); await p.waitForTimeout(25000);
            const text = await p.evaluate(() => document.body.innerText);
            const pick = (re) => (text.match(re) || [null])[0];
            const st = await (await p.request.get(base + '/api/databento/status?root=GC')).json();
            console.log(JSON.stringify({
              signInShown: /Password/.test(text) && /Sign in/.test(text),
              databentoStrip: pick(/DATABENTO[^\n]*/), gcStrip: pick(/GC •[^\n]*/),
              header: text.split('\n').slice(0, 30).join(' | ').slice(0, 900),
              apiCalls: [...api], problems: errs,
              gatewayLastTrade: st.lastTrade, gatewayContract: st.activeContract, verifiedByRealData: st.verifiedByRealData,
            }, null, 1));
            // Settings: two independent provider cards; MT5 relay answer (isolation: MT5 down must not affect GC).
            await p.goto(base + '/#/settings'); await p.waitForTimeout(12000);
            const st2 = await p.evaluate(() => document.body.innerText);
            const card = (t, n) => { const i = st2.indexOf(t); return i < 0 ? null : st2.slice(i, i + n).replace(/\n+/g, ' | '); };
            const mt5 = await p.request.get(base + '/api/mt5/v1/quote/XAUUSD');
            const st3 = await (await p.request.get(base + '/api/databento/status?root=GC')).json();
            console.log(JSON.stringify({
              mt5CloudCard: card('MT5 CLOUD', 420), databentoCard: card('DATABENTO', 700),
              mt5RelayQuote: { status: mt5.status(), body: (await mt5.text()).slice(0, 200) },
              gcWhileMt5Down: { verifiedByRealData: st3.verifiedByRealData, contract: st3.activeContract, lastEventUtc: st3.lastEventUtc, ageMs: st3.lastEventAgeMs },
              localhostRequests: errs.filter((e) => e.startsWith('LOCALHOST')).length,
            }, null, 1));
            await b.close();
          })();
          JS
          node probe.cjs
