              check(!u.dbNa && !/DEPTH DATA UNAVAILABLE/.test(u.strip + u.l2), `${inst}: no generic DEPTH DATA UNAVAILABLE while IBKR depth is LIVE`);
              check(u.hdrDepth === 'IBKR DEPTH: LIVE', `${inst}: header "${u.hdrDepth}"`);
