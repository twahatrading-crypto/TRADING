              check(errs.length === 0, `${inst}: no page errors, auth headers, leaks or VPS / localhost requests ${JSON.stringify(errs).slice(0, 300)}`);
              await ctx.close();
            }
            await b.close();
            console.log(`\nIBKR RESULT: ${fails ? `FAIL (${fails})` : 'PASS'}`);
            process.exit(fails ? 1 : 0);
          })();
