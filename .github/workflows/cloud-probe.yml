# Read-only probe of the deployed TRADING service from GitHub's runners (no secrets used or printed).
# Reports which web bundle is served (cloud vs local build) and what the public Databento endpoints return.
name: cloud-probe
on:
  push:
    branches: ["claude/**"]
    paths: [".github/workflows/cloud-probe.yml", ".github/cloud-probe.trigger"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # set MAX_PROBES via the trigger file content if needed
    env:
      BASE: https://trading-production-e1d5.up.railway.app
      MAX_PROBES: 1
    steps:
      - name: Probe splendid-exploration (once)
        shell: bash
        run: |
          S=https://splendid-exploration-production-535b.up.railway.app
          for p in / /healthz /api/ai/health /api/config; do
            echo "splendid GET $p -> $(curl -s -m 10 -o body -w '%{http_code} %{content_type}' "$S$p") :: $(head -c 160 body | tr '\n' ' ')"
          done
      - name: Probe TRADING (up to 20 min, every 60 s)
        shell: bash
        run: |
          for i in $(seq 1 "${MAX_PROBES:-20}"); do
            echo "=== probe $i $(date -u +%FT%TZ)"
            code=$(curl -s -o index.html -w '%{http_code}' "$BASE/")
            js=$(grep -o 'assets/index-[^"]*\.js' index.html | head -1)
            echo "GET / -> $code  bundle=$js"
            if [ -n "$js" ]; then
              curl -s "$BASE/$js" -o app.js
              echo "bundle kind: cloud=$(grep -c 'through the TLUXE gateway' app.js) local=$(grep -c 'port 8766' app.js)"
            fi
            echo "GET /healthz -> $(curl -s -m 10 "$BASE/healthz" | head -c 200)"
            echo "GET /api/config -> $(curl -s -m 10 "$BASE/api/config" | head -c 300)"
            curl -s -m 15 "$BASE/api/databento/status?root=GC" -o st.json -w "status http %{http_code}\n"
            python3 - <<'PY' || head -c 400 st.json
          import json
          d = json.load(open("st.json"))
          keys = ["state","connection","dataset","plan","subscribed","activeContract","instrumentId","instrumentStatus","lastEventUtc",
                  "lastEventAgeMs","freshness","marketOpen","received","verifiedByRealData","lastTrade","lastBar","source","detail","depth"]
          print(json.dumps({k: d.get(k) for k in keys}, indent=1))
          PY
            if grep -q '"verifiedByRealData": *true' st.json; then
              echo "GET feed -> $(curl -s -m 15 "$BASE/api/databento/v1/feed?cursor=0&roots=GC" | head -c 600)"
              echo "VERIFIED"; break
            fi
            sleep 60
          done
  gcsi:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BASE: https://trading-production-e1d5.up.railway.app
    steps:
      - name: GC + SI real data and history per timeframe (waits up to 20 min for history to settle)
        shell: bash
        run: |
          cat > check.py <<'PY'
          import json, sys, time, urllib.request
          B = "https://trading-production-e1d5.up.railway.app"
          def get(p):
              with urllib.request.urlopen(B + p, timeout=20) as r:
                  return json.load(r)
          final = ("READY", "NOT_ENTITLED", "COST_BLOCKED", "AUTH_ERROR", "UNAVAILABLE", "DISABLED")
          for attempt in range(40):
              out, done = {}, True
              for root in ("GC", "SI"):
                  s = get(f"/api/databento/status?root={root}")
                  h = s.get("history") or {}
                  done &= s.get("verifiedByRealData") is True and h.get("state") in final
                  out[root] = {k: s.get(k) for k in ("state", "connection", "dataset", "subscribed", "activeContract", "instrumentId", "lastEventUtc",
                                                   "lastEventAgeMs", "freshness", "received", "verifiedByRealData", "lastTrade", "lastBar", "depth")}
                  out[root]["history"] = {k: h.get(k) for k in ("state", "contract", "bars", "estimatedCostUsd", "range", "message")}
              if done or attempt == 39:
                  break
              print(time.strftime("%H:%M:%S"), {r: (o["verifiedByRealData"], o["history"]["state"]) for r, o in out.items()}, flush=True)
              time.sleep(30)
          print(json.dumps(out, indent=1))
          h = get("/api/databento/v1/health")
          print("SESSIONS", json.dumps(h.get("sessions"), indent=1))
          for root, inst in (h.get("instruments") or {}).items():
              tape = inst.get("tape") or {}
              print(f"HEALTH {root}: contract={inst.get('activeContract') or tape.get('contract')} counts={inst.get('counts')} "
                    f"tapeCounts={tape.get('counts')} tapeVolume={tape.get('volume')} replaying={tape.get('replaying')} lagMs={tape.get('lagMs')}")
          for root in ("GC", "SI"):
              for tf in ("M1", "M5", "M15", "M30", "H1", "H4", "D1"):
                  c = get(f"/api/databento/v1/candles/{root}?timeframe={tf}&limit=5000")
                  bars = c.get("bars") or []
                  closed = [b for b in bars if b.get("isClosed")]
                  iso = lambda t: time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime(t)) if t else None
                  print(f"{root} {tf:>3}: bars={len(bars):5d} closed={len(closed):5d} contract={c.get('contract')} history={c.get('history')} "
                        f"first={iso(bars[0]['time']) if bars else None} lastClosed={iso(closed[-1]['time']) if closed else None} "
                        f"last={json.dumps({k: bars[-1][k] for k in ('open','high','low','close','volume','isClosed')}) if bars else None}")
          PY
          python3 check.py
  frontend:
    needs: gcsi  # after the GC/SI job has seen the new deployment's history settle
    if: ${{ !contains(github.event.head_commit.message, '[vp-only]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: GC -> SI -> GC in fresh browser contexts; every Databento engine page; contamination check
        shell: bash
        run: |
          npm init -y >/dev/null && npm i -s playwright@1 >/dev/null && npx playwright install --with-deps chromium >/dev/null 2>&1
          cat > probe.cjs <<'JS'
          const { chromium } = require('playwright');
          const base = 'https://trading-production-e1d5.up.railway.app';
          const pages = ['/', '/engines/support-resistance', '/engines/liquidity', '/engines/order-blocks', '/engines/high-low-reversal',
                         '/engines/high-low-engine', '/engines/smc', '/engines/volume-profile', '/engines/volume-footprint', '/engines/liquidity-heatmap'];
          (async () => {
            const b = await chromium.launch();
            const errs = [];
            for (const inst of ['GC', 'SI', 'GC']) {
              // A fresh context = closing and reopening the browser (no state carried over).
              const ctx = await b.newContext({ viewport: { width: 1400, height: 900 } });
              await ctx.addInitScript((i) => { try { localStorage.setItem('tluxe.instrument.v1', i); } catch {} }, inst);
              const p = await ctx.newPage();
              p.on('request', (r) => { if (/:876\d|localhost|127\.0\.0\.1/.test(r.url())) errs.push('LOCALHOST ' + r.url()); });
              p.on('pageerror', (e) => errs.push(String(e).slice(0, 200)));
              const st = await (await p.request.get(base + `/api/databento/status?root=${inst}`)).json();
              const other = inst === 'GC' ? 'SI' : 'GC';
              const otherContract = (await (await p.request.get(base + `/api/databento/status?root=${other}`)).json()).activeContract;
              console.log(`\n######## ${inst}  contract=${st.activeContract}  lastTrade=${JSON.stringify(st.lastTrade)}`);
              for (const path of pages) {
                await p.goto(base + '/#' + path);
                await p.waitForTimeout(path === '/' ? 20000 : 15000);
                const t = await p.evaluate(() => (document.querySelector('main') || document.body).innerText);
                const head = await p.evaluate(() => (document.querySelector('header') || document.body).innerText.slice(0, 400));
                const flat = t.replace(/\s+/g, ' ');
                const contam = otherContract && (flat.includes(otherContract) || head.includes(otherContract));
                console.log(`--- ${inst} ${path}  header: ${head.replace(/\s+/g, ' ').slice(0, 220)}`);
                console.log(`    has ${st.activeContract}: ${flat.includes(st.activeContract) || head.includes(st.activeContract)}  shows ${other} contract ${otherContract}: ${contam}`);
                console.log(`    ${flat.slice(0, 900)}`);
                if (path === '/engines/volume-footprint') {
                  const m = flat.match(/CUMULATIVE DELTA .{0,60}/);
                  console.log(`    FP CVD: ${m ? m[0] : 'n/a'}`);
                  console.log(`    FP INTEGRITY: ${JSON.stringify([...new Set(flat.match(/[^.]{0,50}(late|out-of-order|sequence gap|duplicate|reconnect|disconnect|contract change|DEGRADED)[^.]{0,70}/gi) || [])].slice(0, 12))}`);
                }
                if (path === '/engines/volume-profile') {
                  for (const prof of ['Daily', 'Previous Day']) {
                    await p.getByRole('button', { name: prof, exact: true }).first().click().catch(() => {});
                    await p.waitForTimeout(2000);
                    const v = (await p.evaluate(() => (document.querySelector('main') || document.body).innerText)).replace(/\s+/g, ' ');
                    console.log(`    VP[${prof}] ${v.slice(v.indexOf('VOLUME SOURCE'), v.indexOf('VOLUME SOURCE') + 330)}`);
                  }
                }
              }
              await ctx.close();
            }
            console.log('\nPROBLEMS', JSON.stringify(errs));
            await b.close();
          })();
          JS
          node probe.cjs
  vp:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Volume Profile selector (Current Session -> Daily -> Previous Day -> back) for GC and SI, cross-checked against real M5 candles
        shell: bash
        run: |
          npm init -y >/dev/null && npm i -s playwright@1 >/dev/null && npx playwright install --with-deps chromium >/dev/null 2>&1
          cat > vp.cjs <<'JS'
          const { chromium } = require('playwright');
          const base = 'https://trading-production-e1d5.up.railway.app';
          const fmtVol = (v) => v >= 1e9 ? `${(v / 1e9).toFixed(2)}B` : v >= 1e6 ? `${(v / 1e6).toFixed(2)}M` : v >= 1e4 ? `${(v / 1e3).toFixed(1)}K` : Math.round(v).toLocaleString('en-US');
          const nyHour17 = (t) => { // start (UTC s) of the 17:00 America/New_York trading day containing t
            for (let s = Math.floor(t / 3600) * 3600; s > t - 2 * 86400; s -= 3600) {
              const hh = new Intl.DateTimeFormat('en-US', { timeZone: 'America/New_York', hour: '2-digit', hour12: false }).format(new Date(s * 1000));
              if (Number(hh) === 17 && s <= t) return s;
            }
            return null;
          };
          const iso = (t) => new Date(t * 1000).toISOString().slice(0, 16).replace('T', ' ');
          let fails = 0;
          const check = (ok, msg) => { console.log(`    ${ok ? 'OK  ' : 'FAIL'} ${msg}`); if (!ok) fails++; };
          (async () => {
            const b = await chromium.launch();
            for (const inst of ['GC', 'SI']) {
              const ctx = await b.newContext({ viewport: { width: 1400, height: 1000 } });
              await ctx.addInitScript((i) => { try { localStorage.setItem('tluxe.instrument.v1', i); localStorage.removeItem('tluxe.vp.profile'); } catch {} }, inst);
              const p = await ctx.newPage();
              const errs = [];
              p.on('pageerror', (e) => errs.push(String(e).slice(0, 200)));
              await p.goto(base + '/#/engines/volume-profile');
              await p.waitForTimeout(20000);
              const read = async () => p.evaluate(() => {
                const kv = {};
                for (const d of document.querySelectorAll('[data-testid="vp-stats"] dl.vpkv > div')) kv[d.querySelector('dt').innerText.trim()] = d.querySelector('dd').innerText.trim();
                const sel = document.querySelector('[data-testid="vp-profile-select"]');
                return { select: sel ? sel.value : null, title: (document.getElementById('vpchart-title') || {}).innerText, stats: kv,
                         empty: (document.querySelector('[data-testid="vp-stats"]') || {}).innerText?.includes('NO PROFILE') || false };
              });
              const m5 = (await (await p.request.get(base + `/api/databento/v1/candles/${inst}?timeframe=M5&limit=5000`)).json());
              const now = Math.floor(Date.now() / 1000);
              const parseWin = (w) => { const m = /(\d\d)-(\d\d) (\d\d):(\d\d) → (\d\d)-(\d\d) (\d\d):(\d\d)/.exec(w || ''); if (!m) return null;
                const y = new Date().getUTCFullYear(); return { from: Date.UTC(y, m[1] - 1, m[2], m[3], m[4]) / 1000, to: Date.UTC(y, m[5] - 1, m[6], m[7], m[8]) / 1000 }; };
              const crossCheck = (st, label) => {
                const w = parseWin(st.stats['Window']);
                if (!w) return check(false, `${label}: window not readable (${st.stats['Window']})`);
                const bars = (m5.bars || []).filter((x) => x.isClosed && x.time >= w.from && x.time + 300 <= Math.min(w.to, now));
                const vol = bars.reduce((a, x) => a + x.volume, 0);
                console.log(`    ${label}: real Databento M5 ${m5.contract} in window ${iso(w.from)}→${iso(w.to)} UTC: closed bars=${bars.length} volume=${vol} (${fmtVol(vol)})`);
                const used = Number((st.stats['Bars used'] || '').split(' ')[0]);
                check(Math.abs(used - bars.length) <= 1, `${label}: Bars used ${used} vs independent count ${bars.length} (±1 for a bar closing between reads)`);
                check(st.stats['Total volume'] === fmtVol(vol) || Math.abs(used - bars.length) === 1, `${label}: Total volume ${st.stats['Total volume']} vs independent ${fmtVol(vol)}`);
                return w;
              };
              console.log(`\n######## ${inst}  contract=${m5.contract}`);
              const sel = p.locator('[data-testid="vp-profile-select"]');
              const s0 = await read();
              console.log(`  [start] select=${s0.select} title="${s0.title}" stats=${JSON.stringify(s0.stats)}`);
              check(s0.select === 'CURRENT_SESSION', `${inst} starts on CURRENT_SESSION`);
              const dayStart = nyHour17(now);
              for (const [val, name] of [['DAILY', 'Daily'], ['PREVIOUS_DAY', 'Previous Day']]) {
                await sel.selectOption(val);
                await p.waitForTimeout(2500);
                const s = await read();
                console.log(`  [${name}] select=${s.select} title="${s.title}" stats=${JSON.stringify(s.stats)}`);
                check(s.select === val, `${inst} ${name}: selector value is ${val}`);
                check((s.title || '').includes(name) && (s.stats['Profile'] || '').startsWith(name), `${inst} ${name}: chart title + statistics show "${name}"`);
                check(s.stats['Window'] !== s0.stats['Window'] || name === 'Daily', `${inst} ${name}: window differs from the session window`);
                const w = crossCheck(s, `${inst} ${name}`);
                if (!w) continue;
                check(w.to - w.from >= 23 * 3600 && w.to - w.from <= 25 * 3600, `${inst} ${name}: window is one trading day (${(w.to - w.from) / 3600} h)`);
                if (val === 'DAILY') check(w.from === dayStart, `${inst} Daily: starts at the current 17:00 New York trading-day start ${iso(dayStart)} UTC`);
                if (val === 'PREVIOUS_DAY') {
                  check(w.to <= dayStart, `${inst} Previous Day: completed before the current trading day (${iso(w.to)} <= ${iso(dayStart)})`);
                  check(!(s.stats['Profile'] || '').includes('developing'), `${inst} Previous Day: complete (not developing)`);
                  const between = (m5.bars || []).filter((x) => x.time >= w.to && x.time < dayStart).length;
                  check(between === 0, `${inst} Previous Day: no traded day skipped between it and today (bars in gap = ${between})`);
                }
              }
              await sel.selectOption('CURRENT_SESSION');
              await p.waitForTimeout(2500);
              const s3 = await read();
              console.log(`  [back] select=${s3.select} title="${s3.title}" stats=${JSON.stringify(s3.stats)}`);
              check(s3.select === 'CURRENT_SESSION' && s3.stats['Window'] === s0.stats['Window'] && s3.stats['Profile'] === s0.stats['Profile'], `${inst}: back on the original profile + window`);
              check(errs.length === 0, `${inst}: no page errors ${JSON.stringify(errs)}`);
              await ctx.close();
            }
            await b.close();
            console.log(`\nVP RESULT: ${fails === 0 ? 'PASS' : `FAIL (${fails})`}`);
            process.exit(fails ? 1 : 0);
          })();
          JS
          node vp.cjs
