    # Server-side IBKR depth history on PRODUCTION. Phase A records the running (old) gateway, this push's redeploy is the
    # controlled restart, then: restart survival, browser-independent collection, alignment, refresh, second device.
    if: ${{ contains(github.event.head_commit.message, '[depth]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Recorded IBKR depth history - restart, no-browser collection, alignment, refresh, second device, screenshots
