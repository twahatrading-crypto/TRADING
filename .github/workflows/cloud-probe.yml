      - name: Screenshots in the log (base64 JPEG chunks - the artifact store is not reachable from every reviewer)
        if: always()
        shell: bash
        run: |
          for f in shots/GC-3-second-browser-full-history.jpg shots/SI-3-second-browser-full-history.jpg; do
            [ -f "$f" ] || continue
