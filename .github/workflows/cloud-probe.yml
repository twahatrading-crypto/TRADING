  hm:
    if: ${{ contains(github.event.head_commit.message, '[hm-only]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Liquidity Heatmap GC -> SI -> GC on production (real Databento trades, honest depth)
        shell: bash
        run: |
          npm init -y >/dev/null && npm i -s playwright@1 >/dev/null && npx playwright install --with-deps chromium >/dev/null 2>&1
          cat > hm.cjs <<'JS'
          const { chromium } = require('playwright');
          const base = 'https://trading-production-e1d5.up.railway.app';
          let fails = 0;
          const check = (ok, m) => { console.log(`    ${ok ? 'OK  ' : 'FAIL'} ${m}`); if (!ok) fails++; };
          (async () => {
            const cfg = await (await fetch(base + '/api/config')).json();
            if (cfg.authRequired) { console.log('OWNER AUTH ACTIVE - credential-free check not possible; the owner must verify while signed in.'); process.exit(0); }
            // This push redeploys Railway: let it finish, then wait for GC + SI verified by real data.
            await new Promise((r) => setTimeout(r, 240000));
            for (let i = 0; i < 40; i++) {
              const st = await Promise.all(['GC', 'SI'].map(async (x) => (await fetch(base + `/api/databento/status?root=${x}`)).json()));
              console.log(`settle ${i}: ${st.map((x) => `${x.activeContract} ${x.freshness} trades=${x.received && x.received.trades}`).join(' | ')}`);
              if (st.every((x) => x.verifiedByRealData === true)) break;
              await new Promise((r) => setTimeout(r, 20000));
            }
            const b = await chromium.launch();
            for (const inst of ['GC', 'SI', 'GC']) {
              const st = await (await fetch(base + `/api/databento/status?root=${inst}`)).json();
              const other = inst === 'GC' ? 'SI' : 'GC';
              const otherContract = (await (await fetch(base + `/api/databento/status?root=${other}`)).json()).activeContract;
              console.log(`\n######## ${inst}  contract=${st.activeContract}  depth=${st.depth}  lastTrade=${JSON.stringify(st.lastTrade)}  tape=${JSON.stringify(st.received)}`);
              const ctx = await b.newContext({ viewport: { width: 1920, height: 1080 } });
              await ctx.addInitScript((i) => { try { localStorage.setItem('tluxe.instrument.v1', i); } catch {} }, inst);
              const p = await ctx.newPage();
              const errs = [];
              p.on('pageerror', (e) => errs.push(String(e).slice(0, 200)));
              p.on('request', (r) => { if (/localhost|127\.0\.0\.1|:876\d/.test(r.url())) errs.push('LOCALHOST ' + r.url()); });
              await p.goto(base + '/#/engines/liquidity-heatmap');
              await p.waitForSelector('.ofmain', { timeout: 30000 });
              await p.waitForTimeout(25000);
              // After a Railway restart the bridge delivers the oldest history first; the page says so (LOADING TRADE HISTORY)
              // until the newer real trades arrive. Wait (bounded) for that catch-up before sampling the chart.
              let caught = false, loadingSeen = false;
              for (let k = 0; k < 36 && !caught; k++) {
                const c = await p.evaluate(() => ({ loading: !!document.querySelector('[data-testid="of-tape-loading"]'), last: Number((document.querySelector('.ofbar__last')?.textContent || '').replace(/,/g, '')) }));
                const bridgeLast = (await (await fetch(base + `/api/databento/status?root=${inst}`)).json()).lastTrade;
                loadingSeen = loadingSeen || c.loading;
                caught = !c.loading && bridgeLast && Math.abs(c.last - bridgeLast.price) <= bridgeLast.price * 0.0015;
                if (!caught) await p.waitForTimeout(5000);
                if (k % 6 === 0 || caught) console.log(`  catch-up ${k * 5 + 25}s: loadingNote=${c.loading} page=${c.last} bridge=${bridgeLast && bridgeLast.price}`);
              }
              check(caught, `${inst}: trade history caught up with the bridge (loading note seen: ${loadingSeen})`);
              const u = await p.evaluate(() => {
                const t = (sel) => (document.querySelector(sel)?.textContent || '').replace(/\s+/g, ' ').trim();
                const box = (sel) => { const e = document.querySelector(sel); if (!e) return null; const r = e.getBoundingClientRect(); return { top: Math.round(r.top), bottom: Math.round(r.bottom), w: Math.round(r.width) }; };
                const heat = document.querySelector('[data-testid="of-controls"] input[aria-label="Heatmap"]');
                return { contract: t('[data-testid="of-contract"]'), feeds: t('[data-testid="of-feeds"]'), depthNa: t('[data-testid="of-depth-na"]'), heatDisabled: heat ? heat.disabled : null, heatChecked: heat ? heat.checked : null,
                         book: t('[data-testid="of-book"]'), bookTotals: !!document.querySelector('[data-testid="of-book-totals"]'), canvas: !!document.querySelector('canvas.ofheat__canvas'),
                         events: [...document.querySelectorAll('[data-testid="of-event-row"]')].map((r) => r.textContent.replace(/\s+/g, ' ')), cvdState: t('[data-testid="of-cvd-state"]'), cvdTotals: t('[data-testid="of-cvd-totals"]'), cvdPartial: t('[data-testid="of-cvd-partial"]'),
                         prof: t('[data-testid="of-profile-totals"]'), header: (document.querySelector('header')?.innerText || '').replace(/\s+/g, ' ').slice(0, 300), page: document.querySelector('.ofmain').innerText,
                         overflowX: document.documentElement.scrollWidth - innerWidth, grid: box('.ofgrid'), chart: box('.ofheat'), bottom: box('.ofbottom') };
              });
              // Main chart (canvas pixels): executed-volume dots must never form walls; the price trace must be visible.
              const px = await p.evaluate(() => {
                const c = document.querySelector('canvas.ofheat__canvas');
                if (!c) return null;
                const g = c.getContext('2d');
                const W = c.width, H = c.height, dpr = window.devicePixelRatio || 1;
                const pw = Math.floor(W - 70 * dpr), ph = Math.floor(H - 22 * dpr);
                const d = g.getImageData(0, 0, pw, ph).data;
                let maxCol = 0, wallCols = 0, colored = 0, trace = 0, bands = 0;
                const pts = [];
                for (let x = 0; x < pw; x++) {
                  let n = 0;
                  for (let y = 0; y < ph; y++) {
                    const o = (y * pw + x) * 4, r = d[o], gg = d[o + 1], bb = d[o + 2];
                    const green = gg > 140 && r < 110 && bb < 150, red = r > 170 && gg < 110 && bb < 110, violet = r > 120 && bb > 180 && gg < 170;
                    if (green || red || violet) { n++; colored++; if (x % 7 === 0 && y % 5 === 0 && pts.length < 400) pts.push([x / dpr, y / dpr]); }
                    else if (r > 90 && Math.abs(r - gg) < 25 && Math.abs(gg - bb) < 35) trace++; // neutral grey / white price trace
                    else if ((bb > 150 && r < 90) || (r > 200 && gg > 150 && bb < 80)) bands++; // cyan / blue / yellow liquidity colours
                  }
                  maxCol = Math.max(maxCol, n / ph);
                  if (n / ph > 0.5) wallCols++;
                }
                const agg = document.querySelector('[data-testid="of-dot-agg"]');
                return { maxCol: Math.round(maxCol * 1000) / 1000, wallCols, colored, trace, bands, pts, agg: agg ? agg.value : null, legend: (document.querySelector('.ofheat__legend')?.textContent || '').replace(/\s+/g, ' ').trim() };
              });
              let tip = '';
              if (px) {
                const box = await p.locator('canvas.ofheat__canvas').boundingBox();
                for (const [x, y] of px.pts.slice().reverse()) {
                  await p.mouse.move(box.x + x, box.y + y);
                  if (await p.locator('[data-testid="of-trade-tip"]').count()) { tip = (await p.locator('[data-testid="of-trade-tip"]').innerText()).replace(/\n/g, ' | '); break; }
                }
                await p.mouse.move(0, 0);
              }
              const lastTrade = await p.evaluate(() => Number((document.querySelector('.ofbar__last')?.textContent || '').replace(/,/g, '')));
              console.log(`  chart: maxColumnFill=${px && px.maxCol} wallColumns=${px && px.wallCols} dotPixels=${px && px.colored} tracePixels=${px && px.trace} liquidityBandPixels=${px && px.bands} tradeAgg=${px && px.agg} legend="${px && px.legend}"`);
              console.log(`  hover: ${tip}`);
              console.log(`  last(trade) page=${lastTrade} bridge=${st.lastTrade && st.lastTrade.price}`);
              check(px && px.maxCol < 0.5 && px.wallCols === 0, `${inst}: no vertical bubble walls (max column fill ${px && px.maxCol})`);
              check(px && px.trace > 200 && px.colored > 50, `${inst}: price trace + aggregated volume dots drawn`);
              check(px && px.bands < 50, `${inst}: zero liquidity heatmap bands (${px && px.bands} band-coloured px)`);
              check(px && px.agg === 'auto', `${inst}: Trade aggregation control present (AUTO)`);
              check(/DISPLAY AGGREGATION/.test(tip) && /Databento/i.test(tip) && /Unknown/.test(tip) && /Trades \d/.test(tip), `${inst}: bubble hover shows bucket sums, source, display-aggregation note`);
              const stNow = (await (await fetch(base + `/api/databento/status?root=${inst}`)).json()).lastTrade;
              check(stNow && Math.abs(lastTrade - stNow.price) <= stNow.price * 0.0015, `${inst}: last trade = latest exchange-time trade (${lastTrade} vs bridge ${stNow && stNow.price})`);
              console.log(`  contract=${u.contract} feeds="${u.feeds}"`);
              console.log(`  depthBadge="${u.depthNa}" heatmapToggle disabled=${u.heatDisabled} checked=${u.heatChecked} canvas=${u.canvas}`);
              console.log(`  COB="${u.book.slice(0, 160)}" bookTotals=${u.bookTotals}`);
              console.log(`  CVD state="${u.cvdState}" partial="${u.cvdPartial}" totals="${u.cvdTotals}"`);
              console.log(`  SVP totals="${u.prof}"`);
              console.log(`  events=${u.events.length}: ${JSON.stringify(u.events.slice(0, 4))}`);
              console.log(`  layout: grid=${JSON.stringify(u.grid)} chart=${JSON.stringify(u.chart)} bottom=${JSON.stringify(u.bottom)} overflowX=${u.overflowX}`);
              check(u.contract === st.activeContract, `${inst}: resolved contract ${u.contract} = Databento ${st.activeContract}`);
              check(/DATABENTO/.test(u.header) && /GLBX\.MDP3/.test(u.header) && u.header.includes(st.activeContract), `${inst}: header DATABENTO · GLBX.MDP3 · ${st.activeContract}`);
              check(/TRADES: LIVE/.test(u.feeds), `${inst}: TRADES LIVE (real CME/COMEX executed trades)`);
              check(/VOLUME: LIVE/.test(u.feeds) && /OHLCV: LIVE/.test(u.feeds), `${inst}: OHLCV + VOLUME LIVE`);
              check(!/DEPTH: LIVE/.test(u.feeds) && /DEPTH DATA UNAVAILABLE/.test(u.depthNa), `${inst}: depth honestly unavailable`);
              check(/MBO: NOT ENTITLED/.test(u.feeds), `${inst}: MBO NOT ENTITLED`);
              check(u.heatDisabled === true && u.heatChecked === false, `${inst}: Heatmap (liquidity) layer cannot be enabled without depth`);
              check(/LEVEL-2 DATA UNAVAILABLE/.test(u.book) && /PROVIDER NOT CONNECTED/.test(u.book) && !u.bookTotals, `${inst}: COB unavailable, no book derived from trades`);
              check(u.canvas, `${inst}: executed-trade chart rendered`);
              check(u.events.every((e) => /PRINTS/.test(e)), `${inst}: all events print-based and labelled PRINTS (${u.events.length})`);
              check(/Unknown volume/.test(u.cvdTotals) && /Buy volume/.test(u.cvdTotals) && /Total executed/.test(u.cvdTotals), `${inst}: CVD buy / sell / unknown / total shown`);
              check(!/PARTIAL/.test(u.cvdState) || /unknown volume excluded/.test(u.cvdPartial), `${inst}: CVD PARTIAL spelled out when unknown volume is excluded`);
              check(/Unknown/.test(u.prof), `${inst}: SVP keeps unknown volume separate`);
              check(!u.page.includes(otherContract) && !u.header.includes(otherContract), `${inst}: no ${other} contract (${otherContract}) on the page`);
              check(!/XAUUSD|XAGUSD|MT5 Tick/.test(u.page + u.header), `${inst}: no MT5 / spot contamination`);
              check(u.overflowX === 0 && u.bottom && u.bottom.bottom <= 1080, `${inst}: first view holds chart + COB + SVP + settings/events/CVD, no overflow`);
              check(errs.length === 0, `${inst}: no page errors / localhost requests ${JSON.stringify(errs).slice(0, 200)}`);
              await ctx.close();
            }
            await b.close();
            console.log(`\nHEATMAP RESULT: ${fails ? `FAIL (${fails})` : 'PASS'}`);
            process.exit(fails ? 1 : 0);
          })();
          JS
          node hm.cjs
