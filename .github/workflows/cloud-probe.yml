        run: |
          npm init -y >/dev/null && npm i -s playwright@1 >/dev/null && npx playwright install --with-deps chromium >/dev/null 2>&1
          mkdir -p shots
          cat > depth.cjs <<'JS'
          const { chromium } = require('playwright');
          const base = 'https://twahatrading.com';
          let fails = 0;
          const check = (ok, m) => { console.log(`    ${ok ? 'OK  ' : 'FAIL'} ${m}`); if (!ok) fails++; };
          const j = async (p) => (await fetch(base + p, { headers: { 'User-Agent': 'tluxe-cloud-probe/1.0' } })).json();
          const iso = (t) => (t ? new Date(Number(t)).toISOString() : '—');
          const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
          const hist = async () => j('/api/ibkr/history');
          const rootSt = (h, r) => h.roots && h.roots[r] && h.roots[r][h.contracts ? h.contracts[r] : Object.keys(h.roots[r])[0]];
          // Polling experiment (measurement only). fineAlign = the Phase E 250 ms alignment formula, unchanged, for any window
          // (heatmap requests chunked to 10 min: at most 4000 columns per request).
          const fineAlign = async (r, from, to) => {
            const tick = r === 'GC' ? 0.1 : 0.005;
            const head = await j(`/api/databento/v1/trades/${r}?after=0&limit=1`);
            const tr = await j(`/api/databento/v1/trades/${r}?after=${Math.max(0, head.lastIndex - 20000)}&limit=20000`);
            const cols = [];
            for (let f = from; f < to; f += 600000) cols.push(...(await j(`/api/ibkr/heatmap?root=${r}&from=${Math.floor(f)}&to=${Math.ceil(Math.min(to, f + 600000))}&bucket=250`)).columns);
            const book2 = new Map(cols.map((c) => [c[0], { bb: Math.max(...c[2].map((x) => x[0])), ba: Math.min(...c[3].map((x) => x[0])) }]));
            const tr2 = tr.trades.map((x) => ({ t: Math.floor(x.tsEventNs / 1e6), p: x.price })).filter((x) => x.t >= from && x.t < Math.min(to, Date.now() - 2000));
            const rate2 = (off) => { let n = 0, ok = 0; for (const x of tr2) { const b = book2.get(Math.floor((x.t + off) / 250) * 250); if (!b || !isFinite(b.bb) || !isFinite(b.ba)) continue; n++; if (x.p >= b.bb - tick * 1.01 && x.p <= b.ba + tick * 1.01) ok++; } return n ? ok / n : 0; };
            const fine = [-1000, -500, -250, 0, 250, 500, 750, 1000, 1500].map((o) => ({ o, r: rate2(o) }));
            const bestFine = fine.reduce((a, b) => (b.r > a.r ? b : a));
            const win = Math.max(...fine.filter((x) => x.o >= 0 && x.o <= 750).map((x) => x.r));
            const oldest = tr.trades.length ? Math.floor(tr.trades[0].tsEventNs / 1e6) : null;
