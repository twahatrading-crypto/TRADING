              const book = new Map(m.columns.map((c) => [c[0], { bb: Math.max(...c[2].map((x) => x[0])), ba: Math.min(...c[3].map((x) => x[0])) }]));
              const trades = tr.trades.map((x) => ({ t: Math.floor(x.tsEventNs / 1e6), p: x.price, c: x.contract })).filter((x) => x.t >= ts[0] && x.t < now - 2000);
              const rate = (off) => { let n = 0, ok = 0; for (const x of trades) { const b = book.get(Math.floor((x.t + off) / 1000) * 1000); if (!b || !isFinite(b.bb) || !isFinite(b.ba)) continue; n++; if (x.p >= b.bb - tick * 1.01 && x.p <= b.ba + tick * 1.01) ok++; } return { n, r: n ? ok / n : 0 }; };
