              await p.goto(base + '/#/engines/liquidity-heatmap');
              await p.waitForSelector('.ofmain', { timeout: 30000 });
              await p.waitForTimeout(45000);
              const u = await p.evaluate(() => {
                const t = (sel) => (document.querySelector(sel)?.textContent || '').replace(/\s+/g, ' ').trim();
                const heat = document.querySelector('[data-testid="of-controls"] input[aria-label="Heatmap"]');
                return { contract: t('[data-testid="of-contract"]'), feeds: t('[data-testid="of-feeds"]'), depthNa: t('[data-testid="of-depth-na"]'), rec: t('[data-testid="of-depth-recorded"]'),
                         heatDisabled: heat ? heat.disabled : null, heatChecked: heat ? heat.checked : null, session: t('[data-testid="ibkr-session"]'),
                         src: t('[data-testid="ibkr-dom-source"]'), imb: t('[data-testid="ibkr-imbalance"]'), rows: document.querySelectorAll('[data-testid="ibkr-dom"] tbody tr').length,
                         dom: t('[data-testid="of-book"]'), header: (document.querySelector('header')?.innerText || '').replace(/\s+/g, ' ').slice(0, 300), page: document.querySelector('.ofmain').innerText,
                         cvd: t('[data-testid="of-cvd-totals"]'), prof: t('[data-testid="of-profile-totals"]'),
                         strip: t('[data-testid="databento-strip"]'), l2: t('[data-testid="level2-depth-status"]'), hdrDepth: t('[data-testid="depth-status"]'),
                         dbNa: !!document.querySelector('[data-testid="databento-depth-unavailable"]') };
              });
              const px = await p.evaluate(() => {
                const c = document.querySelector('canvas.ofheat__canvas');
                if (!c) return null;
                const d = c.getContext('2d').getImageData(0, 0, c.width, c.height).data;
                let bands = 0;
                for (let o = 0; o < d.length; o += 4) { const r = d[o], g = d[o + 1], bb = d[o + 2]; if ((bb > 150 && r < 90) || (r > 200 && g > 150 && bb < 80)) bands++; }
                return { bands };
              });
              console.log(`  feeds="${u.feeds}"`);
              console.log(`  session="${u.session}"`);
              console.log(`  DOM rows=${u.rows} source="${u.src}"`);
              console.log(`  imbalance="${u.imb}"`);
              console.log(`  DOM="${u.dom.slice(0, 260)}"`);
              console.log(`  heatmap toggle disabled=${u.heatDisabled} checked=${u.heatChecked} bandPx=${px && px.bands} depthNa="${u.depthNa}" recorded="${u.rec}"`);
              console.log(`  CVD="${u.cvd}" SVP="${u.prof}"`);
              console.log(`  header depth="${u.hdrDepth}"`);
              console.log(`  level-2 banner="${u.l2}"`);
              console.log(`  databento strip="${u.strip.slice(0, 400)}"`);
              console.log(`  hosts=${[...hosts].join(',')} ibkrCalls=${ibkrCalls.length} e.g. ${ibkrCalls.slice(0, 3).join(' ')}`);
              console.log(`  Authorization headers seen: ${[...authValues].join(' | ') || 'none'}`);
              check(/DEPTH · IBKR LIVE/.test(u.feeds), `${inst}: DEPTH · IBKR LIVE`);
              check(/TRADES( · DATABENTO)?:? LIVE/.test(u.feeds) && /OHLCV: LIVE/.test(u.feeds) && /VOLUME: LIVE/.test(u.feeds), `${inst}: Databento trades / OHLCV / volume LIVE`);
              check(/MBO: NOT ENTITLED/.test(u.feeds), `${inst}: Databento MBO stays NOT ENTITLED`);
              check(u.rows > 0 && /PRICE_LEVEL/.test(u.src) && /MBO false/.test(u.src) && /Interactive Brokers/.test(u.src), `${inst}: COB = IBKR price levels (${u.rows} rows), PRICE_LEVEL, MBO false`);
              check(/Visible IBKR book/.test(u.imb), `${inst}: imbalance labelled as the visible IBKR book`);
              check(u.heatDisabled === false, `${inst}: Heatmap toggle enabled (genuine depth)`);
              check(u.heatChecked !== true || (px && px.bands > 0), `${inst}: heatmap draws recorded IBKR depth (${px && px.bands} band px)`);
              check(/RECORDED DEPTH HISTORY/.test(u.rec), `${inst}: recorded-history label shown`);
