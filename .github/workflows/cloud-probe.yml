  capture:
    # Read-only copy of real recorded GC depth + trades (public read-only endpoints) into the log (gzip + base64 chunks),
    # so a renderer change can be checked locally on real data before it is deployed. Nothing is written anywhere.
    if: ${{ contains(github.event.head_commit.message, '[capture]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Capture recorded GC depth matrix + trades (read only)
        shell: bash
        run: |
          cat > cap.cjs <<'JS'
          const zlib = require('zlib');
          const base = 'https://twahatrading.com';
          const j = async (p) => (await fetch(base + p, { headers: { 'User-Agent': 'tluxe-cloud-probe/1.0' } })).json();
          const out = (name, obj) => {
            const b = zlib.gzipSync(Buffer.from(JSON.stringify(obj))).toString('base64');
            const n = Math.ceil(b.length / 60000);
            for (let i = 0; i < n; i++) console.log(`CAPT ${name} ${i + 1}/${n} ${b.slice(i * 60000, (i + 1) * 60000)}`);
            console.log(`captured ${name}: ${b.length} base64 chars`);
          };
          (async () => {
            const now = Date.now();
            for (const r of ['GC']) {
              out(`${r}-m1000`, await j(`/api/ibkr/heatmap?root=${r}&from=${now - 45 * 60000}&to=${now}&bucket=1000`));
              out(`${r}-m5000`, await j(`/api/ibkr/heatmap?root=${r}&from=${now - 4 * 3600000}&to=${now}&bucket=5000`));
              out(`${r}-cov`, await j(`/api/ibkr/coverage?root=${r}&from=${now - 3600000}&to=${now}`));
              const head = await j(`/api/databento/v1/trades/${r}?after=0&limit=1`);
              const tr = await j(`/api/databento/v1/trades/${r}?after=${Math.max(0, head.lastIndex - 20000)}&limit=20000`);
              out(`${r}-trades`, tr);
              out(`${r}-book`, await j(`/api/ibkr/book?root=${r}`));
              // Real Databento candles of every S&R timeframe (existing read-only candles endpoint).
              for (const tf of ['M1', 'M5', 'M15', 'M30', 'H1', 'H4', 'D1']) out(`${r}-candles-${tf}`, await j(`/api/databento/v1/candles/${r}?timeframe=${tf}&limit=5000`));
            }
            out('ibkr-status', await j('/api/ibkr/status'));
            // Recorded GC depth of the last live hour before the IBKR outage (2026-09-30 05:45 - 06:45:30 UTC) at the
            // server's own buckets, its coverage, and every Databento trade of that window - read only.
            const F = Date.UTC(2026, 8, 30, 5, 45), T = Date.UTC(2026, 8, 30, 6, 45, 30);
            out('W-m250', await j(`/api/ibkr/heatmap?root=GC&from=${Date.UTC(2026, 8, 30, 6, 30)}&to=${T}&bucket=250`));
            for (const b of [1000, 2000, 5000, 10000, 15000, 30000]) out(`W-m${b}`, await j(`/api/ibkr/heatmap?root=GC&from=${F}&to=${T}&bucket=${b}`));
            out('W-m60000', await j(`/api/ibkr/heatmap?root=GC&from=${Date.UTC(2026, 8, 29, 22, 45)}&to=${T}&bucket=60000`));
            out('W-cov', await j(`/api/ibkr/coverage?root=GC&from=${Date.UTC(2026, 8, 30, 4, 45, 30)}&to=${T}`));
            {
              const head = await j('/api/databento/v1/trades/GC?after=0&limit=1');
              let hi = head.lastIndex, all = [];
              for (let k = 0; k < 60; k++) {
                const after = Math.max(0, hi - 20000);
                const tr = await j(`/api/databento/v1/trades/GC?after=${after}&limit=20000`);
                all = tr.trades.concat(all);
                const oldest = tr.trades.length ? tr.trades[0].tsEventNs / 1e6 : null;
                if (after === 0 || oldest === null || oldest <= F) break;
                hi = after;
              }
              const w = all.filter((x) => x.tsEventNs / 1e6 >= F - 60000 && x.tsEventNs / 1e6 < T);
              out('W-trades', { trades: w, oldestLoaded: all.length ? all[0].tsEventNs / 1e6 : null });
            }
            console.log('CAPTURE DONE', new Date(now).toISOString());
          })();
          JS
          node cap.cjs
  mapval:
    # Live IBKR validation for the GC Liquidity Map (READ ONLY, public read-only endpoints): consecutive live book
    # samples, recording counts, the outage gap / reconnect boundary, the latest 250 ms matrix, candles + trades.
    if: ${{ contains(github.event.head_commit.message, '[mapval]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Live IBKR depth + recording + outage boundary (read only)
        shell: bash
        run: |
          cat > mv.cjs <<'JS'
          const zlib = require('zlib');
          const base = 'https://twahatrading.com';
          const j = async (p) => (await fetch(base + p, { headers: { 'User-Agent': 'tluxe-cloud-probe/1.0' } })).json();
          const out = (name, obj) => {
            const b = zlib.gzipSync(Buffer.from(JSON.stringify(obj))).toString('base64');
            const n = Math.ceil(b.length / 60000);
            for (let i = 0; i < n; i++) console.log(`CAPT ${name} ${i + 1}/${n} ${b.slice(i * 60000, (i + 1) * 60000)}`);
          };
          const iso = (t) => (t ? new Date(Number(t)).toISOString() : '-');
          const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
          const OUTAGE = Date.UTC(2026, 8, 30, 6, 45, 0, 819); // last depth before the outage (earlier probes)
          const OBS_AT_OUTAGE = 867458; // GC observations while OFFLINE (depth job b84c567)
          (async () => {
            // 1. consecutive live samples
            const samples = [];
            for (let i = 0; i < 20; i++) {
              const [st, bk] = await Promise.all([j('/api/ibkr/status'), j('/api/ibkr/book?root=GC')]);
              const r = st.roots?.GC ?? {};
              const bids = (bk.rows?.bids ?? []).map((x) => [x.price, x.size]);
              const asks = (bk.rows?.asks ?? []).map((x) => [x.price, x.size]);
              samples.push({ at: Date.now(), state: bk.state, statusState: r.state, contract: bk.contract?.localSymbol, lastUpdateMs: bk.lastUpdateMs, depthSeq: bk.depthSeq, bids, asks });
              console.log(`SAMPLE ${i + 1} ${iso(Date.now())} state=${bk.state} contract=${bk.contract?.localSymbol} lastUpdate=${iso(bk.lastUpdateMs)} seq=${bk.depthSeq} rows=${bids.length}x${asks.length} bid=${JSON.stringify(bids.slice(0, 3))} ask=${JSON.stringify(asks.slice(0, 3))}`);
              await sleep(1000);
            }
            const key = (s, side) => JSON.stringify(s[side]);
            let bidCh = 0, askCh = 0, tsAdv = 0;
            for (let i = 1; i < samples.length; i++) {
              if (key(samples[i], 'bids') !== key(samples[i - 1], 'bids')) bidCh++;
              if (key(samples[i], 'asks') !== key(samples[i - 1], 'asks')) askCh++;
              if (samples[i].lastUpdateMs > samples[i - 1].lastUpdateMs) tsAdv++;
            }
            console.log(`LIVE SUMMARY: ${samples.length} samples, lastUpdate advanced ${tsAdv}/19, bid rows changed ${bidCh}/19, ask rows changed ${askCh}/19, states ${[...new Set(samples.map((s) => s.state))]}, contracts ${[...new Set(samples.map((s) => s.contract))]}, rows ${[...new Set(samples.map((s) => s.bids.length + 'x' + s.asks.length))]}, max age at read ${Math.max(...samples.map((s) => s.at - s.lastUpdateMs))} ms`);
            out('MV-samples', samples);
            // 2. recording
            const h1 = await j('/api/ibkr/history');
            const status = await j('/api/ibkr/status');
            out('MV-history', h1);
            out('MV-status', status);
            // 3. outage boundary: find the first recorded coverage after the outage (2 h windows forward from the outage)
            let firstAfter = null, beforeEnd = null;
            const pre = await j(`/api/ibkr/coverage?root=GC&from=${OUTAGE - 3600000}&to=${OUTAGE + 3600000}`);
            out('MV-cov-outage', pre);
            beforeEnd = Math.max(...(pre.union ?? []).map((u) => u[1]).filter((x) => x <= OUTAGE + 1000));
            for (let f = OUTAGE + 1000; f < Date.now() && !firstAfter; f += 2 * 3600000) {
              const c = await j(`/api/ibkr/coverage?root=GC&from=${f}&to=${Math.min(f + 2 * 3600000, Date.now())}`);
              if (c.union && c.union.length) { firstAfter = c.union[0][0]; out('MV-cov-resume', c); }
            }
            const h2 = await (async () => { await sleep(30000); return j('/api/ibkr/history'); })();
            const g1 = h1.roots?.GC ? Object.values(h1.roots.GC)[0] : null, g2 = h2.roots?.GC ? Object.values(h2.roots.GC)[0] : null;
            console.log(`RECORDING last before outage ${iso(beforeEnd)} | first after reconnect ${iso(firstAfter)} | gap ${firstAfter && beforeEnd ? ((firstAfter - beforeEnd) / 3600000).toFixed(2) + ' h' : '-'}`);
            console.log(`RECORDING GC history now: ${JSON.stringify(g2).slice(0, 400)}`);
            console.log(`RECORDING observations: at outage ${OBS_AT_OUTAGE} -> now ${g2?.observations} (+${g2 ? g2.observations - OBS_AT_OUTAGE : '-'}); +${g1 && g2 ? g2.observations - g1.observations : '-'} in 30 s`);
            out('MV-history2', h2);
            // 4. matrices: outage boundary at 60 s, latest 15 min at 250 ms
            const now = Date.now();
            out('MV-m60000', await j(`/api/ibkr/heatmap?root=GC&from=${OUTAGE - 3 * 3600000}&to=${Math.min(now, OUTAGE - 3 * 3600000 + 3800 * 60000)}&bucket=60000`));
            if (firstAfter) out('MV-m1000-resume', await j(`/api/ibkr/heatmap?root=GC&from=${firstAfter - 600000}&to=${firstAfter + 1800000}&bucket=1000`));
            out('MV-m250', await j(`/api/ibkr/heatmap?root=GC&from=${now - 15 * 60000}&to=${now}&bucket=250`));
            out('MV-book-end', await j('/api/ibkr/book?root=GC'));
            for (const tf of ['M1', 'M5', 'M15', 'M30', 'H1']) out(`MV-candles-${tf}`, await j(`/api/databento/v1/candles/GC?timeframe=${tf}&limit=3000`));
            const head = await j('/api/databento/v1/trades/GC?after=0&limit=1');
            out('MV-trades', await j(`/api/databento/v1/trades/GC?after=${Math.max(0, head.lastIndex - 20000)}&limit=20000`));
            console.log('MAPVAL DONE', iso(Date.now()));
          })();
          JS
          node mv.cjs
  mapprod:
    # GC Liquidity Map on the PRODUCTION domain (READ ONLY): waits for the deployed bundle, opens the page in Chromium,
    # compares the drawn CURRENT DEPTH (canvas diagnostics) with /api/ibkr/book, follows the live heat edge, reads
    # the pills / Strong Liquidity Now panel, and writes screenshots to the log (gzip + base64). Nothing is written anywhere.
    if: ${{ contains(github.event.head_commit.message, '[mapprod]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: GC Liquidity Map production verification (read only)
        shell: bash
        run: |
          npm init -y >/dev/null && npm i -s playwright@1 >/dev/null && npx playwright install --with-deps chromium >/dev/null 2>&1
          cat > mp.cjs <<'JS'
          const zlib = require('zlib');
          const { chromium } = require('playwright');
          const base = 'https://twahatrading.com';
          const UA = { 'User-Agent': 'tluxe-cloud-probe/1.0' };
          const j = async (p) => (await fetch(base + p, { headers: UA })).json();
          const iso = (t) => (t ? new Date(Number(t)).toISOString() : '-');
          const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
          const out = (name, buf) => {
            const b = zlib.gzipSync(buf).toString('base64');
            const n = Math.ceil(b.length / 60000);
            for (let i = 0; i < n; i++) console.log(`CAPT ${name} ${i + 1}/${n} ${b.slice(i * 60000, (i + 1) * 60000)}`);
          };
          let fails = 0;
          const check = (ok, m) => { console.log(`    ${ok ? 'OK  ' : 'FAIL'} ${m}`); if (!ok) fails++; };
          (async () => {
            const cfg = await j('/api/config');
            if (cfg.authRequired) { console.log('OWNER AUTH ACTIVE - credential-free check not possible.'); process.exit(0); }
            // 1. wait for the deployed bundle that contains the new route
            let deployed = false, asset = '';
            for (let i = 0; i < 60 && !deployed; i++) {
              const html = await (await fetch(base + '/', { headers: UA })).text();
              const m = html.match(/\/assets\/index-[^"']+\.js/);
              asset = m ? m[0] : '';
              if (asset) deployed = (await (await fetch(base + asset, { headers: UA })).text()).includes('gc-liquidity-map');
              console.log(`deploy ${i}: bundle=${asset} hasRoute=${deployed}`);
              if (!deployed) await sleep(20000);
            }
            check(deployed, `production bundle ${asset} serves /engines/gc-liquidity-map`);
            if (!deployed) process.exit(1);
            // 2. IBKR depth LIVE again after the gateway redeploy
            let live = null;
            for (let i = 0; i < 40; i++) {
              const bk = await j('/api/ibkr/book?root=GC');
              console.log(`ibkr ${i}: ${iso(Date.now())} state=${bk.state} contract=${bk.contract?.localSymbol} lastUpdate=${iso(bk.lastUpdateMs)} rows=${bk.rows?.bids?.length}x${bk.rows?.asks?.length}`);
              if (bk.state === 'LIVE' && Date.now() - bk.lastUpdateMs < 5000) { live = bk; break; }
              await sleep(15000);
            }
            check(!!live, 'IBKR GC depth LIVE on production before the page check');
            const db = await j('/api/databento/status?root=GC');
            console.log(`databento GC: contract=${db.activeContract} freshness=${db.freshness} verified=${db.verifiedByRealData} lastTrade=${JSON.stringify(db.lastTrade)}`);
            // 3. the page
            const b = await chromium.launch();
            const ctx = await b.newContext({ viewport: { width: 1680, height: 960 } });
            await ctx.addInitScript(() => { try { localStorage.setItem('tluxe.instrument.v1', 'GC'); } catch {} });
            const p = await ctx.newPage();
            const errs = [], reqs = new Set();
            p.on('pageerror', (e) => errs.push(String(e).slice(0, 200)));
            p.on('request', (r) => { const u = new URL(r.url()); if (/localhost|127\.0\.0\.1|:876\d|:4001/.test(r.url())) errs.push('LOCAL ' + r.url()); if (u.pathname.startsWith('/api/')) reqs.add(u.pathname); });
            await p.goto(base + '/#/engines/gc-liquidity-map');
            await p.waitForSelector('[data-testid="gcmap"]', { timeout: 60000 });
            await p.waitForSelector('canvas.gcmap__canvas', { timeout: 120000 }).catch(() => {});
            for (let i = 0; i < 24; i++) {
              const d = await p.evaluate(() => document.querySelector('canvas.gcmap__canvas')?.dataset.depth || 'none');
              if (d !== 'none') break;
              await p.waitForTimeout(5000);
            }
            await p.waitForTimeout(10000);
            const ui = await p.evaluate(() => {
              const t = (sel) => (document.querySelector(sel)?.textContent || '').replace(/\s+/g, ' ').trim();
              return { title: t('.gcmap__title'), sub: t('.gcmap__sub'), feeds: t('.gcmap__feeds'), bar: t('.gcmap__bar'), header: (document.querySelector('header')?.innerText || '').replace(/\s+/g, ' ').slice(0, 400),
                       now: t('[data-testid="gcmap-now"]'), nodata: t('[data-testid="gcmap-nodata"]'), limit: t('[data-testid="gcmap-limit"]'), legend: t('.gcmap__legend'),
                       nav: [...document.querySelectorAll('nav[aria-label="Main navigation"] a')].map((a) => a.textContent.trim()), overflowX: document.documentElement.scrollWidth - innerWidth };
            });
            console.log(`UI: ${JSON.stringify(ui)}`);
            check(ui.title === 'GC Liquidity Map', 'page title GC Liquidity Map');
            check(/GCZ6/.test(ui.sub) && /GC/.test(ui.header), `contract on page: "${ui.sub}"`);
            check(/DATABENTO\s*·?\s*LIVE|DATABENTO LIVE/i.test(ui.feeds), `Databento pill LIVE: "${ui.feeds}"`);
            check(/IBKR LIVE/i.test(ui.feeds), `IBKR depth pill LIVE: "${ui.feeds}"`);
