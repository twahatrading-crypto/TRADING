              check(!/XAUUSD|XAGUSD/.test(u.page), `${inst}: no XAUUSD / XAGUSD`);
              // static.cloudflareinsights.com = the Cloudflare Web Analytics beacon injected by the Cloudflare edge (not app code).
              check([...hosts].every((h) => h === 'twahatrading.com' || h === 'static.cloudflareinsights.com' || /fonts\.(googleapis|gstatic)\.com/.test(h)), `${inst}: browser talks only to twahatrading.com (+ Cloudflare's edge beacon)`);
