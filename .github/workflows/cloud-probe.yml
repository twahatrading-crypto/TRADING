                check(d.dupCols === '0' || d.dupCols === undefined, `${inst} ${n}: no duplicated history timestamps (${d.dupCols})`);
                check(/RECORDED DEPTH HISTORY SINCE/.test(d.rec), `${inst} ${n}: "${d.rec.slice(0, 70)}"`);
                check(/TRADES · DATABENTO LIVE/.test(d.feeds) && /OHLCV: LIVE/.test(d.feeds) && /VOLUME: LIVE/.test(d.feeds) && /DEPTH · IBKR LIVE/.test(d.feeds), `${inst} ${n}: Databento trades/OHLCV/volume LIVE + IBKR depth LIVE`);
