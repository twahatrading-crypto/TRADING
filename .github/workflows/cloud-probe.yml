          };
          const fmtFine = (a) => `${a.fine.map((x) => `${x.o}ms=${(x.r * 100).toFixed(1)}%`).join(' ')} | best ${a.bestFine.o} ms ${(a.bestFine.r * 100).toFixed(1)}% | best within 0-750 ms ${(a.win * 100).toFixed(1)}% | ${a.n} trades${a.complete ? '' : ' (trade history shorter than the window)'}`;
