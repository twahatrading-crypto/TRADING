              const ts = m.columns.map((c) => c[0]);
              const dup = ts.length - new Set(ts).size;
              const span = ts.length ? Math.round((ts[ts.length - 1] - ts[0]) / 1000) + 1 : 0;
              const offGrid = m.columns.flatMap((c) => c[2].concat(c[3])).filter(([p]) => Math.abs(p / tick - Math.round(p / tick)) > 1e-6).length;
              const db = await j(`/api/databento/status?root=${r}`);
              console.log(`${r} matrix: contract=${m.contract} (Databento ${db.activeContract}) bucket=${m.bucketMs} columns=${ts.length} firstColumn=${iso(ts[0])} lastColumn=${iso(ts[ts.length - 1])} firstRecorded=${iso(m.firstRecordedMs)} duplicates=${dup} missingBuckets=${span - ts.length} offTickPrices=${offGrid}`);
              check(ts[0] >= Math.floor(m.firstRecordedMs / 1000) * 1000, `${r}: first liquidity column is not before the first recorded snapshot`);
              check(dup === 0, `${r}: no duplicated timestamps`);
