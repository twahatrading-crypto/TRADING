            for (const r of ['GC', 'SI']) { const st = rootSt(before, r); B[r] = st; console.log(`BEFORE restart ${r}: first=${iso(st && st.firstMs)} latest=${iso(st && st.lastMs)} rows=${st && st.rows} observations=${st && st.observations}`); }
